<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buoy — Make plans with your people</title>
<meta name="description" content="Buoy is the low-effort way to actually hang out with the people you already know. Drop a buoy, friends see it, they join.">
<meta property="og:title" content="Buoy — Make plans with your people">
<meta property="og:description" content="The low-effort way to actually hang out with the people you already know.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --brand: #3a5a75; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--brand);
    color: #fff;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 40px 28px 26px;
  }

  /* ---------- shared pieces ---------- */
  .buoy-svg { animation: bob 1.8s ease-in-out infinite; display: block; }
  .waves-svg { display: block; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-11px); }
  }
  @media (prefers-reduced-motion: reduce) { .buoy-svg { animation: none; } }

  .wordmark {
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
  }
  .tagline { color: rgba(255,255,255,0.72); }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 30px;
    border-radius: 999px;
    background: #fff;
    color: var(--brand);
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 18px rgba(0,0,0,0.16);
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 7px 24px rgba(0,0,0,0.22); }
  .cta svg { width: 19px; height: 19px; }
  .soon { font-size: 13px; color: rgba(255,255,255,0.42); }

  footer {
    font-size: 13px;
    color: rgba(255,255,255,0.38);
    text-align: center;
  }
  footer a { color: rgba(255,255,255,0.55); text-decoration: none; }
  footer a:hover { color: rgba(255,255,255,0.85); }
  footer span { margin: 0 8px; }

  /* ---------- mobile: centred stack ---------- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .mark { display: flex; flex-direction: column; align-items: center; }
  .copy { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .buoy-svg { width: 128px; height: auto; }
  .waves-svg { width: 218px; height: auto; margin-top: -15px; }
  .wordmark { font-size: clamp(44px, 12vw, 58px); margin-top: 26px; }
  .tagline { font-size: clamp(15px, 4vw, 18px); margin-top: 12px; }
  .cta { margin-top: 36px; }
  .soon { margin-top: 14px; }
  footer { margin-top: 34px; }

  /* ---------- desktop: logo left, text right ---------- */
  @media (min-width: 860px) {
    .page { padding: 56px 48px 34px; }
    .main {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 72px;
    }
    .mark { display: flex; flex-direction: column; align-items: center; }
    .buoy-svg { width: 236px; }
    .waves-svg { width: 402px; margin-top: -27px; }
    .copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .wordmark { font-size: 96px; margin-top: 0; }
    .tagline { font-size: 22px; margin-top: 16px; }
    .cta { margin-top: 42px; }
    .soon { margin-top: 14px; }
  }
</style>
</head>

<script>
  // Paste the App Store link here once Buoy is live. The button then
  // activates and the "coming soon" note hides itself.
  var APP_STORE_URL = "";
  var btn = document.getElementById("appstore");
  if (APP_STORE_URL) {
    btn.href = APP_STORE_URL;
    document.getElementById("soonNote").style.display = "none";
  } else {
    btn.style.opacity = "0.55";
    btn.style.pointerEvents = "none";
  }
</script>
